# Purpose: k8s Deployment — llama-server sidecar + FastAPI proxy; initContainer pre-downloads GGUF model.
# boiler plate
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-proxy
  namespace: default
  labels:
    app: llm-proxy
# boiler plate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-proxy
  template:
    metadata:
      labels:
        app: llm-proxy
    spec:
      # initContainer: pre-download Qwen3.5 GGUF into shared /models before main containers start
      initContainers:
        - name: model-prefetch
          image: curlimages/curl:8.21.0
          command: ["sh", "-c"]
          args:
            - curl -sSL --connect-timeout 10 --max-time 600 --retry 3 -o /models/Qwen3.5-0.8B-UD-Q6_K_XL.gguf https://huggingface.co/unsloth/Qwen3.5-0.8B-MTP-GGUF/resolve/main/Qwen3.5-0.8B-UD-Q6_K_XL.gguf
          volumeMounts:
            - name: models
              mountPath: /models
      # containers: llama-server inference sidecar + fastapi-proxy frontend
      containers:
        # llama-server: llama.cpp backend on 8080; flags mirror compose.yaml
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --model
            - /models/Qwen3.5-0.8B-UD-Q6_K_XL.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --threads
            - "2"
            - --ctx-size
            - "2048"
            - --no-webui
            - --reasoning
            - "off"
            - --temp
            - "1.0"
            - --top-k
            - "20"
            - --top-p
            - "0.95"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "1.5"
            - --repeat-penalty
            - "1.25"
          # boiler plate
          ports:
            - containerPort: 8080
          # volumeMounts: shared /models volume populated by initContainer
          volumeMounts:
            - name: models
              mountPath: /models
          # resources: CPU/memory requests — HPA scales on cpu utilization vs requests
          resources:
            requests:
              cpu: 2000m
              memory: 1Gi
            limits:
              memory: 2Gi
        # fastapi-proxy: OpenAI-compat frontend, forwards to llama-server on loopback
        - name: fastapi-proxy
          image: ghcr.io/bobthebot988/llm-proxy:latest
          # env: upstream URL + system prompt injected when client sends none
          env:
            - name: LLAMA_CPP_URL
              value: http://127.0.0.1:8080
            - name: SYSTEM_PROMPT
              value: "Always interpret the user prompt without any ambiguity, what the user prompted you is what he meant no other meaning, Always answer in a simple manner"
          # boiler plate
          ports:
            - containerPort: 8000
          # boiler plate
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          # readinessProbe: /health returns 200 only when llama-server is reachable
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
      # volumes: shared emptyDir (tmpfs) for GGUF — no host mount needed
      volumes:
        - name: models
          emptyDir: {}
