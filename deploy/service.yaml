# Purpose: NodePort Service for llm-proxy — external entry point on port 30080.
# boiler plate
apiVersion: v1
kind: Service
metadata:
  name: llm-proxy
  namespace: default
  labels:
    app: llm-proxy
# boiler plate
spec:
  type: NodePort
  selector:
    app: llm-proxy
# NodePort mapping: host port 30080 -> proxy container 8000 (matches kind-config extraPortMappings)
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
