# Purpose: HPA for exp4 variant — autoscale llm-proxy on CPU (target 60%),
# up to 4 replicas (cluster: master + 4 workers). Named distinctly so it
# can't silently collide with deploy/hpa.yaml when both are applied.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-proxy-exp4
  namespace: default
  labels:
    app: llm-proxy
# scaleTargetRef: HPA acts on the llm-proxy Deployment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-proxy
# min/max replica bounds for autoscaling
  minReplicas: 1
  maxReplicas: 4
# metric: scale when average CPU utilization vs requested cpu exceeds 60%
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
