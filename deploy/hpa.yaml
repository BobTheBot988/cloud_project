# Purpose: HPA — autoscale llm-proxy deployment on CPU utilization (target 60%).
# boiler plate
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-proxy
  namespace: default
  labels:
    app: llm-proxy
# scaleTargetRef: HPA acts on the llm-proxy Deployment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-proxy
# min/max replica bounds for autoscaling
  minReplicas: 1
  maxReplicas: 2
# metric: scale when average CPU utilization vs requested cpu exceeds 60%
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
