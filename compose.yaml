# Purpose: local dev stack — llama-server backend + FastAPI proxy frontend (podman-compose).
# Services mirror the k8s deployment (same images, flags, ports).
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    # boiler plate — publish backend on host port 8080
    ports:
      - "8080:8080"
    # mount host GGUF blob into container with :Z relabel (SELinux single-container mount)
    volumes:
      - $HOME/.cache/huggingface/hub/models--unsloth--Qwen3.5-0.8B-MTP-GGUF/blobs/97e5390ba91cec538a570dde30a8b659bbfaf394284427a3de093495c7982fe1:/models/Qwen3.5-0.8B-UD-Q6_K_XL.gguf:Z
    # llama-server startup flags: Qwen3.5 arch, 2 threads, 2048 ctx, reasoning off, sampling params
    command: --model /models/Qwen3.5-0.8B-UD-Q6_K_XL.gguf --host 0.0.0.0 --port 8080 --threads 2 --ctx-size 2048 --no-webui --reasoning off --temp 1.0 --top-k 20 --top-p 0.95 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.25

  # proxy: FastAPI OpenAI-compat passthrough, built from ./Dockerfile
  proxy:
    build: .
    # boiler plate — publish proxy on host port 8000
    ports:
      - "8000:8000"
    # proxy environment: upstream llama-server URL + system prompt injected when client sends none
    environment:
      LLAMA_CPP_URL: http://llama-server:8080
      SYSTEM_PROMPT: "Always interpret the user prompt without any ambiguity, what the user prompted you is what he meant no other meaning, Always answer in a simple manner"
    # startup ordering: llama-server must be up before proxy
    depends_on:
      - llama-server
